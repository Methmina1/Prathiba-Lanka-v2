spring.application.name=PrathibaLanka

# ---------- Database ----------
# Values default to the docker-compose setup for local development; override with env vars
# in any real deployment so credentials are not kept in the repository.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/travel_agency}
spring.datasource.username=${DB_USERNAME:travel_admin}
spring.datasource.password=${DB_PASSWORD:secret}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.generate-ddl=true

# NOTE: parameter-value logging (org.hibernate.type.descriptor.sql.BasicBinder=TRACE) was removed
# on purpose - it writes submitted PII and password hashes into the application log.
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.tool.schema=INFO
logging.level.org.springframework.orm.jpa=INFO

# ---------- Email ----------
spring.mail.host=${MAIL_HOST:smtp.mailtrap.io}
spring.mail.port=${MAIL_PORT:2525}
spring.mail.username=${MAIL_USERNAME:testing}
spring.mail.password=${MAIL_PASSWORD:123}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
# Mail is sent inline while handling the request. JavaMail's default timeouts are infinite, so an
# unreachable SMTP host would block the request thread forever - a trivial DoS on the public
# contact/booking endpoints. Individual mail failures are already caught and logged.
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ---------- JWT ----------
# Must be at least 32 bytes for HS256 (64+ for HS512). Always set JWT_SECRET outside local dev.
app.jwt.secret=${JWT_SECRET:dev-only-insecure-secret-change-me-in-production-0123456789abcdefghij}
# 24 hours
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
# Issuer claim (identifies your app)
app.jwt.issuer=${JWT_ISSUER:PrathibaLanka}

# ---------- Bootstrap admin ----------
# There is no admin-registration API, so a fresh database cannot reach /api/admin/** without this.
# The account is created if missing and its hash is repaired only if it is not a valid BCrypt hash.
# Set BOOTSTRAP_ADMIN_ENABLED=false (and provision admins deliberately) in production.
app.bootstrap-admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:true}
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:admin@test.com}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:Admin@12345}
app.bootstrap-admin.full-name=${BOOTSTRAP_ADMIN_NAME:PrathibaLanka Admin}
