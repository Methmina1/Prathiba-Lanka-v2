spring.application.name=PrathibaLanka

# ---------- HTTP ----------
# Platforms (Railway, Render, Fly) hand the port to the app in $PORT and route to it; 8080 is the
# local default. forward-headers-strategy matters behind their TLS proxy: it is what tells the app
# the original scheme, host and client address, for logs and for anything that builds a URL.
server.port=${PORT:8080}
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:framework}

# Browsers may call this API only from these origins. The front end is a separate deployment, so
# this is configuration: set CORS_ALLOWED_ORIGINS to the deployed front end (comma separated).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# ---------- Database ----------
# Defaults match docker-compose.yml; override with env vars outside local development.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/travel_agency}
spring.datasource.username=${DB_USERNAME:travel_admin}
spring.datasource.password=${DB_PASSWORD:secret}
# The schema is owned by Flyway (db/migration); Hibernate only checks it matches the entities.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.generate-ddl=false
spring.jpa.show-sql=false

# No BasicBinder TRACE here: it writes submitted PII and password hashes into the log.
logging.level.org.hibernate.SQL=${SQL_LOG_LEVEL:WARN}
logging.level.org.hibernate.tool.schema=INFO
logging.level.org.springframework.orm.jpa=INFO

# ---------- Schema migrations ----------
# V1 is the schema as it stood when Flyway was introduced, so a database that already has the tables
# is baselined at 1 (Flyway records it as applied without running it) and a fresh one runs it. Either
# way the same migration history exists afterwards, and ddl-auto=validate proves the entities match.
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration

# ---------- Health ----------
# The platform polls /actuator/health. Only health and info are exposed; everything else under
# /actuator stays closed even though the endpoint exists.
management.endpoints.web.exposure.include=${ACTUATOR_ENDPOINTS:health,info}
management.endpoint.health.show-details=${ACTUATOR_HEALTH_DETAILS:never}
management.endpoint.health.probes.enabled=true
# The mail health indicator opens an SMTP connection on every poll, which turned a health check into a
# five second wait against smtp.gmail.com. The site serves fine without the mail account, so it is not
# a health criterion - EmailService records whatever it fails to send in email_log instead.
management.health.mail.enabled=${HEALTH_MAIL_ENABLED:false}
# Cache the result briefly: a health check that hits the database every second from the platform's
# prober is load for no benefit.
management.endpoint.health.cache.time-to-live=${HEALTH_CACHE:2s}

# ---------- Rate limiting ----------
# Applies to the endpoints a stranger can write to: the enquiry form and the two auth endpoints.
# A shared nothing instance keeps its counters in memory, which is enough for one replica.
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.rate-limit.requests-per-minute=${RATE_LIMIT_PER_MINUTE:20}
app.rate-limit.burst=${RATE_LIMIT_BURST:5}
app.rate-limit.paths=${RATE_LIMIT_PATHS:/api/contact,/api/auth/login,/api/auth/register}

# ---------- Email ----------
# How mail leaves the application. Two transports, and which one works depends on where it runs:
#
#   smtp - JavaMail to a mail server. Local development and CI. NOT usable on Railway's Free, Trial
#          or Hobby plans: outbound SMTP is blocked there, which is the whole reason for the second
#          option (https://docs.railway.com/networking/outbound-networking).
#   bird - Bird's email API over HTTPS, over the verified sending domain mail.prathibalanka.com.
#          What production uses. The DKIM key, the bounce record and DMARC are the same either way -
#          only how the message reaches Bird changes.
#   none - send nothing, and write every attempt to email_log.
app.mail.transport=${MAIL_TRANSPORT:smtp}

# Where a reply should go. The sending subdomain is built to send only - a DKIM key, a bounce CNAME
# and a DMARC record, and deliberately no MX - so without this a customer who replies to a booking
# email writes into a mailbox that does not exist. The default is the agency's own inbox, which is the
# one that answers; bookings@mail.prathibalanka.com is only worth using once Bird's inbound MX records
# are published and Bird is routing that mail somewhere a person reads.
app.mail.reply_to=${MAIL_REPLY_TO:prathibhalankavoyages@gmail.com}

# ---------- Bird (app.mail.transport=bird) ----------
# The host is chosen by the API key's region prefix: bk_us1_ keys call us1.platform.bird.com and
# bk_eu1_ keys call eu1.platform.bird.com. A bk_eu1_ key sent to the older SparkPost-compatible host
# answers 401, which looks like a bad key rather than the wrong address - it is not.
# Create the key in Bird's dashboard (Developers -> API keys) with send permission; it goes in the
# Authorization header as "Bearer <key>" and belongs in the environment, never in this file.
app.mail.bird.api-url=${BIRD_API_URL:https://eu1.platform.bird.com/v1/email/messages}
app.mail.bird.api-key=${BIRD_API_KEY:}
# Compared against app.mail.from at startup: Bird only sends as a domain it has verified, so a From
# address anywhere else is worth a warning at boot rather than a failed enquiry later.
app.mail.bird.sending-domain=${BIRD_SENDING_DOMAIN:mail.prathibalanka.com}

# ---------- SMTP (app.mail.transport=smtp) ----------
# The development default, and the agency's Gmail account. Gmail will not accept an account password
# over SMTP: set MAIL_PASSWORD to a Google App Password (myaccount.google.com/apppasswords, which
# needs 2-step verification switched on first). It belongs in the environment, never in this file -
# anything committed here is readable by everyone with repository access, and stays in the history.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:prathibhalankavoyages@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
# Mail is sent asynchronously; JavaMail's defaults are infinite, so without these an unreachable SMTP
# server blocks a mail worker thread (public /api/contact is the easiest way to hit that).
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
# The subjects carry an en dash and the bodies are UTF-8. Without this, JavaMail encodes with the
# platform default and a subject arrives as "Your Trip is Confirmed! â€“ PIN: ...".
spring.mail.default-encoding=UTF-8

# The sender recipients see. Left unset, JavaMail invents one (user@host), which providers reject.
# Over SMTP this has to be the authenticated account or a verified alias on it; over the Bird API it
# has to be an address on the verified sending domain, i.e. something@mail.prathibalanka.com.
app.mail.from=${MAIL_FROM:prathibhalankavoyages@gmail.com}
app.mail.from-name=${MAIL_FROM_NAME:PrathibaLanka}

# ---------- Uploaded media ----------
# Images and short videos are written to disk and served from app.media.url-prefix. The per-type
# limits below are enforced by MediaStorageService; the multipart limits are the hard ceiling.
app.media.dir=${MEDIA_DIR:uploads}
app.media.url-prefix=${MEDIA_URL_PREFIX:/media}
app.media.max-image-bytes=${MEDIA_MAX_IMAGE_BYTES:10485760}
app.media.max-video-bytes=${MEDIA_MAX_VIDEO_BYTES:62914560}
spring.servlet.multipart.max-file-size=${MEDIA_MAX_UPLOAD:64MB}
spring.servlet.multipart.max-request-size=${MEDIA_MAX_REQUEST:70MB}

# ---------- JWT ----------
# At least 32 bytes (HS256). Always set JWT_SECRET outside local development.
app.jwt.secret=${JWT_SECRET:dev-only-insecure-secret-change-me-in-production-0123456789abcdefghij}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.jwt.issuer=${JWT_ISSUER:PrathibaLanka}

# ---------- Bootstrap admin ----------
# Self-registration only creates customers, so this creates the first admin. Set
# BOOTSTRAP_ADMIN_ENABLED=false in production.
#
# The password has no default on purpose: a password in a repository is a password everybody has.
# Export BOOTSTRAP_ADMIN_PASSWORD before the first start, and the account is created with it; leave
# it unset and no admin is created (the startup log says so). To change the password later, set
# BOOTSTRAP_ADMIN_PASSWORD and BOOTSTRAP_ADMIN_RESET_PASSWORD=true for one start - see
# AdminBootstrapConfig.
app.bootstrap-admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:true}
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:prathibhalankavoyages@gmail.com}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap-admin.full-name=${BOOTSTRAP_ADMIN_NAME:Prathibha Lanka Voyages}
app.bootstrap-admin.reset-password=${BOOTSTRAP_ADMIN_RESET_PASSWORD:false}

# ---------- Bootstrap page content ----------
# Seeds the About and Contact pages from src/main/resources/content when they have no row yet.
# Existing rows are never overwritten.
app.bootstrap-content.enabled=${BOOTSTRAP_CONTENT_ENABLED:true}
