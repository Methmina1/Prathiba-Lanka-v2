# Production overrides. Activate with SPRING_PROFILES_ACTIVE=prod.
#
# Everything here is either a safety rail (a secret that must not have a default, a path that must be
# a mounted volume) or a performance decision (not logging every query). The rules this file does NOT
# change - ports, CORS, rate limits - live in application.properties and are set by environment
# variables.

# ---------- Secrets have no defaults ----------
# A default secret in a repository is a secret everyone has, and the app would start happily with it.
# Both of these fail the boot instead, which is the only version of this that is noticed.
app.jwt.secret=${JWT_SECRET}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}

# ---------- Uploaded media must be on a volume ----------
# A container's own disk is thrown away on every deploy: without a mounted volume, every cover,
# gallery photograph and page image disappears on the next release while the database still points at
# it. Railway: add a volume to the service and mount it at /data, then MEDIA_DIR=/data/uploads.
app.media.dir=${MEDIA_DIR}

# ---------- Logging ----------
# Query logging is a development tool: at INFO it drowns the log, and the SQL contains customer data.
logging.level.root=${LOG_LEVEL:INFO}
logging.level.org.hibernate.SQL=${SQL_LOG_LEVEL:WARN}
spring.jpa.show-sql=false

# ---------- Pooling ----------
# Sized for one small instance; raise HIKARI_MAX_POOL_SIZE with the plan, not above the database's
# own connection limit.
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:2}

# ---------- Sessions must not hold a database connection ----------
# Safe here because every association the DTOs read is @ManyToOne (eager by default) and there are no
# lazy collections: the mapping in the controllers does not need an open session.
spring.jpa.open-in-view=false
