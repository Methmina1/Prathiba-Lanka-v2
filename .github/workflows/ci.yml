name: Spring Boot CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, updates]
  workflow_dispatch:

permissions:
  contents: read

# One run per branch/PR at a time; a new push cancels the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Compile & test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: travel_agency_test
        ports:
          - 5432:5432
        # GitHub waits for this health check before running the steps below, which is why no
        # separate "wait for postgres" step is needed.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_URL: jdbc:postgresql://localhost:5432/travel_agency_test
      DB_USERNAME: testuser
      DB_PASSWORD: testpassword
      # The admin password has no default in application.properties, so CI supplies a throwaway one
      # for the context-load test. api-tests signs in with the same variable.
      BOOTSTRAP_ADMIN_EMAIL: prathibhalankavoyages@gmail.com
      BOOTSTRAP_ADMIN_PASSWORD: ci-only-throwaway-password

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          # Matches <java.version>21</java.version> in pom.xml, so CI tests the runtime the jar targets.
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and run tests with Maven
        run: mvn -B -ntp clean verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload application jar
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/PrathibaLanka-*.jar
          if-no-files-found: error

  api-tests:
    name: API endpoint tests
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: travel_agency_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_URL: jdbc:postgresql://localhost:5432/travel_agency_test
      DB_USERNAME: testuser
      DB_PASSWORD: testpassword
      # The app creates its admin from these, and api-tests signs in with the same variables.
      BOOTSTRAP_ADMIN_EMAIL: prathibhalankavoyages@gmail.com
      BOOTSTRAP_ADMIN_PASSWORD: ci-only-throwaway-password

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Download application jar
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: app

      # The backend sends mail; point it at a local sink so the mail paths are exercised
      # without an external SMTP provider. -Dump records what was sent, for the sender check below.
      - name: Start fake SMTP server
        run: |
          nohup pwsh -NoProfile -File scripts/fake-smtp.ps1 -Port 2525 -Dump smtp-dump.txt > smtp.log 2>&1 &
          sleep 3

      - name: Start application
        run: |
          nohup java -jar app/PrathibaLanka-*.jar \
            --server.port=8080 \
            --spring.mail.host=127.0.0.1 \
            --spring.mail.port=2525 \
            --spring.mail.properties.mail.smtp.auth=false \
            --spring.mail.properties.mail.smtp.starttls.enable=false \
            > app.log 2>&1 &

      - name: Wait for the application to be ready
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/api/packages > /dev/null; then
              echo "Application is up (after ${i} checks)"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Application did not become ready in time"
          tail -n 60 app.log
          exit 1

      - name: Run endpoint tests
        run: pwsh -NoProfile -File scripts/api-tests.ps1 -BaseUrl http://localhost:8080

      # EmailService used to send without a sender at all, which providers reject - and the console's
      # reply used to be written into the database and never sent at all, while the panel said "saved".
      # Neither is visible from the API, so this reads what the mail server was actually handed: the
      # From on the header and the envelope, the reply with its reference in the subject, and the link
      # inside it opening that customer's own enquiry. See scripts/verify-mail.ps1.
      - name: Verify the mail the application sends
        env:
          MAIL_FROM: prathibhalankavoyages@gmail.com
          MAIL_FROM_NAME: PrathibaLanka
        run: pwsh -NoProfile -File scripts/verify-mail.ps1 -BaseUrl http://localhost:8080 -Dump smtp-dump.txt

      - name: Application log
        if: always()
        run: tail -n 100 app.log || true

      - name: SMTP log
        if: always()
        run: tail -n 50 smtp.log || true

      - name: Mail dump
        if: always()
        run: tail -n 80 smtp-dump.txt || true

  # The artifact Railway actually runs: the image, started the way the platform starts it, with the
  # prod profile against a real Postgres. This is what proves the safety rails work - the container
  # exits when JWT_SECRET is missing instead of running on the repository's development key - that
  # Flyway creates the schema on an empty database, and that /actuator/health, the endpoint the
  # platform's health check polls, reports UP.
  docker-image:
    name: Docker image starts with the prod profile
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: travel_agency_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t prathibalanka-api:ci .

      - name: It refuses to start without JWT_SECRET
        run: |
          if timeout 90 docker run --rm \
              -e DB_URL=jdbc:postgresql://host.docker.internal:5432/travel_agency_test \
              -e DB_USERNAME=testuser -e DB_PASSWORD=testpassword \
              --add-host=host.docker.internal:host-gateway \
              prathibalanka-api:ci > /tmp/no-secret.log 2>&1; then
            echo "::error::the image started with no JWT_SECRET"; exit 1
          fi
          grep -q 'JWT_SECRET' /tmp/no-secret.log || { tail -n 40 /tmp/no-secret.log; exit 1; }
          echo "Refused to start, and named the variable."

      - name: Start it against Postgres
        run: |
          docker run -d --name api -p 8080:8080 \
            --add-host=host.docker.internal:host-gateway \
            -e JWT_SECRET=ci-only-throwaway-secret-long-enough-for-hs256 \
            -e DB_URL=jdbc:postgresql://host.docker.internal:5432/travel_agency_test \
            -e DB_USERNAME=testuser -e DB_PASSWORD=testpassword \
            -e MEDIA_DIR=/data/uploads \
            -e BOOTSTRAP_ADMIN_PASSWORD=ci-only-throwaway-password \
            prathibalanka-api:ci

      - name: Wait for the health endpoint
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "UP after ${i} checks"
              exit 0
            fi
            sleep 2
          done
          echo "::error::the container never reported UP"
          docker logs api
          exit 1

      - name: The bootstrap admin and the catalogue work
        run: |
          TOKEN=$(curl -sf -X POST http://localhost:8080/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"prathibhalankavoyages@gmail.com","password":"ci-only-throwaway-password"}' \
            | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')
          test -n "$TOKEN" || { echo "::error::the bootstrap admin could not sign in"; docker logs api; exit 1; }
          curl -sf http://localhost:8080/api/packages > /dev/null
          echo "Signed in as the bootstrap admin and read the catalogue."

      - name: Container log
        if: always()
        run: docker logs api || true
